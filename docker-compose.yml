services:
  backend:
    image: ${BACKEND_IMAGE}
    pull_policy: always
    env_file:
      - ./backend/.env
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"

  frontend:
    image: ${FRONTEND_IMAGE}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:80"
