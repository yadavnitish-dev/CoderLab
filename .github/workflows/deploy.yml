name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      backend_image: ${{ steps.images.outputs.backend_image }}
      frontend_image: ${{ steps.images.outputs.frontend_image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Backend Tests & Coverage
        run: |
          cd backend
          npm install
          npx prisma generate
          npm run test:coverage
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://mock:mock@localhost:5432/mock
          JWT_SECRET: mock_secret
          JDOODLE_CLIENT_ID: mock_id
          JDOODLE_CLIENT_SECRET: mock_secret

      - name: Validate image namespace
        run: |
          if [ -z "${IMAGE_NAMESPACE}" ]; then
            echo "IMAGE_NAMESPACE GitHub variable is required."
            exit 1
          fi

      - name: Set image names
        id: images
        run: |
          echo "backend_image=${REGISTRY}/${IMAGE_NAMESPACE}/algoprep-backend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${REGISTRY}/${IMAGE_NAMESPACE}/algoprep-frontend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.images.outputs.backend_image }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/algoprep-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.images.outputs.frontend_image }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/algoprep-frontend:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JDOODLE_CLIENT_ID: ${{ secrets.JDOODLE_CLIENT_ID }}
          JDOODLE_CLIENT_SECRET: ${{ secrets.JDOODLE_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_CALLBACK_URL: ${{ secrets.GOOGLE_CALLBACK_URL }}
          GH_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          GH_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
          GH_CALLBACK_URL: ${{ secrets.GH_CALLBACK_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          envs: FRONTEND_URL,DATABASE_URL,JWT_SECRET,JDOODLE_CLIENT_ID,JDOODLE_CLIENT_SECRET,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,GOOGLE_CALLBACK_URL,GH_CLIENT_ID,GH_CLIENT_SECRET,GH_CALLBACK_URL,RESEND_API_KEY,UPSTASH_REDIS_REST_URL,UPSTASH_REDIS_REST_TOKEN
          script: |
            set -euo pipefail

            # Use absolute path to avoid ~ expansion issues
            APP_DIR="/home/${{ secrets.EC2_USERNAME }}/algoprep"
            BACKEND_IMAGE="${{ needs.build-and-push.outputs.backend_image }}"
            FRONTEND_IMAGE="${{ needs.build-and-push.outputs.frontend_image }}"
            REPO_URL="https://${{ secrets.GHCR_USERNAME }}:${{ secrets.GHCR_TOKEN }}@github.com/${{ github.repository }}.git"

            # Create directory if it doesn't exist
            if [ ! -d "$APP_DIR" ]; then
              echo "Directory $APP_DIR not found. Creating and cloning..."
              mkdir -p "$APP_DIR"
              git clone "$REPO_URL" "$APP_DIR"
            fi

            cd "$APP_DIR"

            # Update the remote URL in case the token changed
            git remote set-url origin "$REPO_URL"

            # Ensure we are on the main branch
            git fetch origin main
            git checkout -f main
            git pull origin main

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

            # Generate .env file from environment variables passed via SSH
            cat <<EOF > backend/.env
            PORT=8080
            FRONTEND_URL=$FRONTEND_URL
            DATABASE_URL=$DATABASE_URL
            JWT_SECRET=$JWT_SECRET
            JDOODLE_CLIENT_ID=$JDOODLE_CLIENT_ID
            JDOODLE_CLIENT_SECRET=$JDOODLE_CLIENT_SECRET

            GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID
            GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET
            GOOGLE_CALLBACK_URL=$GOOGLE_CALLBACK_URL

            GITHUB_CLIENT_ID=$GH_CLIENT_ID
            GITHUB_CLIENT_SECRET=$GH_CLIENT_SECRET
            GITHUB_CALLBACK_URL=$GH_CALLBACK_URL

            RESEND_API_KEY=$RESEND_API_KEY
            UPSTASH_REDIS_REST_URL=$UPSTASH_REDIS_REST_URL
            UPSTASH_REDIS_REST_TOKEN=$UPSTASH_REDIS_REST_TOKEN
            EOF

            # Clean up indentation in .env
            sed -i 's/^[[:space:]]*//' backend/.env

            export BACKEND_IMAGE
            export FRONTEND_IMAGE

            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -af
