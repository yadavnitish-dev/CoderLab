name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      backend_image: ${{ steps.images.outputs.backend_image }}
      frontend_image: ${{ steps.images.outputs.frontend_image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate image namespace
        run: |
          if [ -z "${IMAGE_NAMESPACE}" ]; then
            echo "IMAGE_NAMESPACE GitHub variable is required."
            exit 1
          fi

      - name: Set image names
        id: images
        run: |
          echo "backend_image=${REGISTRY}/${IMAGE_NAMESPACE}/leetlab-backend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${REGISTRY}/${IMAGE_NAMESPACE}/leetlab-frontend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.images.outputs.backend_image }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/leetlab-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.images.outputs.frontend_image }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/leetlab-frontend:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail

            APP_DIR="${{ vars.EC2_APP_DIR || '~/AlgoPrep' }}"
            BACKEND_IMAGE="${{ needs.build-and-push.outputs.backend_image }}"
            FRONTEND_IMAGE="${{ needs.build-and-push.outputs.frontend_image }}"

            cd "$APP_DIR"

            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

            export BACKEND_IMAGE
            export FRONTEND_IMAGE

            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
